name: aimkt 

services:
  frontend:
    build:
      context: ./frontend
    command: ["npm", "run", "dev"]
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    depends_on:
      - backend

  monitor:
    build:
      context: ./monitor
    command: ["npm", "run", "dev"]
    ports:
      - "3001:3001"
    volumes:
      - ./monitor:/app
      - /app/node_modules
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    depends_on:
      - backend


  backend:
    build: 
      context: ./backend
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_GRPC_PORT=6334
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_TTL_SECONDS=1800
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DB=default
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL-deepseek-chat}
      - LLM_BASE_URL=${LLM_BASE_URL-https://api.deepseek.com}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER-openai}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL-text-embedding-3-small}
      - EMBEDDING_SIZE=${EMBEDDING_SIZE-1536}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL}
      - COLLECTION_NAME=${COLLECTION_NAME-ai_mkt_data}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - ENABLE_KNOWLEDGE_RAG=${ENABLE_KNOWLEDGE_RAG-true}
      - ENABLE_SCHEMA_RAG=${ENABLE_SCHEMA_RAG-false}
    depends_on:
      - qdrant
      - redis
      - clickhouse

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: clickhouse_aimkt
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: qdrant_aimkt
    restart: unless-stopped
    ports: 
      - "6333:6333" 
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_STATIC_CONTENT=true

  redis:
    image: redis:7-alpine
    container_name: redis_aimkt
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  qdrant_storage:
  redis_data:
  clickhouse_data: